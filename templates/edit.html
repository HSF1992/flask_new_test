
{% extends "base.html" %}
{% block content %}
    <h1>用户编辑</h1>
    <form method="POST">
        <label>用户名:</label>
        <input type="text" name="username" value="{{ 用户[1] }}" required>
        <br>
        <label>权限：</label>
        <select name="role">
            <option value="user" {% if 用户[3] == "user" %}selected{% endif %}>普通用户</option>
            <option value="admin" {% if 用户[3] == "admin" %}selected{% endif %}>超级用户</option>
        </select>
        <br>
        <button type="submit">确定</button>
        <a href="/admin">取消</a>
    </form>
{% endblock %}
