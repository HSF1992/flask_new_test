{% extends "base.html" %}

{% block content %}
    <h1>查询结果</h1>
    {% if 数据 %}
        <table>
            <thead>
                <tr>
                    <th>批号</th>
                    <th>收率</th>
                    <th>结果</th>
                    <th>日期</th>
                </tr>
            </head>
            <tbody>
                {% for i in 数据 %}
                <tr>
                    <td>{{ i[0] }}</td>
                    <td>{{ i[1] }}</td>
                    <td>{{ i[2] }}</td>
                    <td>{{ i[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>在{{ 日期 }}之后没有找到记录</p>
    {% endif %}
{% endblock %}
