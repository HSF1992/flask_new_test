{% extends "base.html" %}

{% block content %}
    <h1>注册</h1>
    <form method="POST" action="/register">
        <label>用户名：</label>
        <input type="text" name="username" required>
        <br>
        <br>
        <label>密    码：</label>
        <input type="password" name="password" required>
        <br>
        <br>
        <button type="submit">注册</button>
    </form>
    <p>已有帐号？<a href="/login">去登录</a></p>
{% endblock %}
