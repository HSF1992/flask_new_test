{% extends "base.html" %}

{% block content %}
    <h1>登录</h1>
    <form method="POST" action="/login">
        <label>用户名：</label>
        <input type="text" name="username" required>
        <br>
        <br>
        <label>密  码：</label>
        <input type="password" name="password" required>
        <br>
        <br>
        <button type="submit">登录</button>
    </form>

    <p><a href="/register">还没有账号，去注册！</a></p>
{% endblock %}
